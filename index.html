<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>室設乙模擬考抽題系統 - Teenage Engineering Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #DCDCD7;
      --device-bg: #E6E5E0;
      --card-bg: #F4F3EE;
      --border-color: #111111;
      --text-color: #111111;
      --accent-orange: #FF3B00;
      --sub-text: #666660;
      --border-width: 2px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(var(--sub-text) 0.75px, transparent 0.75px),
        linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 16px 16px, 32px 32px;
      font-family: 'JetBrains Mono', 'Noto Sans TC', monospace, sans-serif;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .te-device {
      width: 100%;
      max-width: 520px;
      background: var(--device-bg);
      border: var(--border-width) solid var(--border-color);
      border-radius: 12px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        inset 0 -2px 0 rgba(0, 0, 0, 0.1);
      padding: 20px;
      position: relative;
    }

    /* Metal Corner Screws */
    .screw {
      width: 10px;
      height: 10px;
      border: 1.5px solid var(--border-color);
      border-radius: 50%;
      position: absolute;
      background: #D5D4CE;
    }
    .screw::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 2px;
      right: 2px;
      height: 1.5px;
      background: var(--border-color);
      transform: translateY(-50%) rotate(45deg);
    }
    .screw.tl { top: 8px; left: 8px; }
    .screw.tr { top: 8px; right: 8px; }
    .screw.bl { bottom: 8px; left: 8px; }
    .screw.br { bottom: 8px; right: 8px; }

    /* Header Status Bar */
    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #B8B7B0;
      font-size: 10px;
      letter-spacing: 1.5px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-orange);
      box-shadow: 0 0 6px var(--accent-orange);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: var(--border-width) solid var(--border-color);
      background: var(--border-color);
      gap: 2px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: var(--device-bg);
      border: none;
      padding: 12px 0;
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--border-color);
      color: #FFFFFF;
    }

    .tab-btn:hover:not(.active) {
      background: #E0DFDA;
    }

    .view-content {
      display: none;
    }

    .view-content.active {
      display: block;
    }

    /* Main Grid Layout */
    .draw-grid {
      display: grid;
      grid-template-columns: 68px 1fr;
      border: var(--border-width) solid var(--border-color);
      background: var(--card-bg);
    }

    .time-column {
      display: flex;
      flex-direction: column;
      border-right: var(--border-width) solid var(--border-color);
    }

    .time-block {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      writing-mode: vertical-lr;
      text-orientation: upright;
      background: #EAE8E2;
    }

    .time-block.morning {
      border-bottom: var(--border-width) solid var(--border-color);
    }

    .cards-column {
      display: flex;
      flex-direction: column;
    }

    .exam-card {
      position: relative;
      padding: 10px 14px 8px 14px;
      height: 110px; /* Fixed card height */
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-bottom: var(--border-width) solid var(--border-color);
      background: #FFFFFF;
    }

    .exam-card:last-child {
      border-bottom: none;
    }

    .badge-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 20px;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .badge {
      background: var(--border-color);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 2px;
      line-height: 1;
      display: inline-block;
      border: 1.5px solid var(--border-color);
    }

    .badge-outline {
      background: transparent;
      color: var(--text-color);
      border: 1.5px solid var(--border-color);
      font-size: 12px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 2px;
      line-height: 1;
      display: inline-block;
    }

    .pool-counter {
      font-size: 10px;
      font-weight: 800;
      color: var(--sub-text);
      letter-spacing: 0.5px;
    }

    .timestamp-inline {
      font-size: 11px;
      font-weight: 600;
      color: var(--sub-text);
      margin-left: 6px;
    }

    /* Result Display Area */
    .result-display {
      font-size: 36px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 3px;
      height: 52px;
      line-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      overflow: hidden;
      white-space: nowrap;
    }

    .result-display.animating {
      color: var(--accent-orange);
    }

    .card-action-bar {
      display: flex;
      justify-content: flex-end;
      height: 22px;
    }

    .btn-action-compact {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text-color);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action-compact:hover {
      background: var(--border-color);
      color: #FFFFFF;
    }

    .btn-action-compact:active {
      transform: translateY(1px);
    }

    .btn-action-compact.delete:hover {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      color: #FFFFFF;
    }

    /* Master Draw All Button */
    .master-draw-container {
      margin-top: 16px;
    }

    .btn-master {
      width: 100%;
      background: var(--accent-orange);
      color: #FFFFFF;
      border: var(--border-width) solid var(--border-color);
      padding: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--border-color);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-master:hover {
      background: #E63500;
    }

    .btn-master:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border-color);
    }

    /* History Log List View */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-list::-webkit-scrollbar {
      width: 6px;
    }
    .history-list::-webkit-scrollbar-track {
      background: #E0DFDA;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
    }

    .history-group {
      border: var(--border-width) solid var(--border-color);
      background: #FFFFFF;
    }

    .history-group-header {
      background: #EAE8E2;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1.5px;
      border-bottom: var(--border-width) solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--sub-text);
      font-weight: 600;
      font-size: 14px;
      border: 2px dashed #B8B7B0;
      background: rgba(255, 255, 255, 0.4);
    }

    .clear-history-container {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-secondary {
      background: transparent;
      border: 1.5px solid var(--border-color);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: var(--border-color);
      color: #FFFFFF;
    }

    .device-footer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px dashed #B8B7B0;
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--sub-text);
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="te-device">
    <div class="screw tl"></div>
    <div class="screw tr"></div>
    <div class="screw bl"></div>
    <div class="screw br"></div>

    <div class="device-header">
      <div class="brand-tag">
        <div class="status-led"></div>
        <span>TE-EXAM-2026 // FIELD UNIT</span>
      </div>
      <div>室設乙模擬考</div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('draw')">抽題</button>
      <button class="tab-btn" onclick="switchTab('history')">記錄</button>
    </div>

    <!-- VIEW 1: DRAW TAB -->
    <div id="view-draw" class="view-content active">
      <div class="draw-grid">
        <div class="time-column">
          <div class="time-block morning">上午</div>
          <div class="time-block afternoon">下午</div>
        </div>

        <div class="cards-column">
          <!-- Card 1: 平配 -->
          <div class="exam-card">
            <div class="badge-container">
              <div class="badge-group">
                <span class="badge">平配</span>
              </div>
              <span class="pool-counter" id="cnt-pingpei">36/36</span>
            </div>
            <div class="result-display" id="res-pingpei"></div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('pingpei')">抽題</button>
            </div>
          </div>

          <!-- Card 2: 天 / 立 -->
          <div class="exam-card">
            <div class="badge-container">
              <div class="badge-group">
                <span class="badge-outline" id="badge-tian">天</span>
                <span class="badge-outline" id="badge-li">立</span>
              </div>
              <span class="pool-counter" id="cnt-tianli">6/6</span>
            </div>
            <div class="result-display" id="res-tianli"></div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('tianli')">抽題</button>
            </div>
          </div>

          <!-- Card 3: 透視 -->
          <div class="exam-card">
            <div class="badge-container">
              <div class="badge-group">
                <span class="badge">透視</span>
              </div>
              <span class="pool-counter" id="cnt-toushi">18/18</span>
            </div>
            <div class="result-display" id="res-toushi"></div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('toushi')">抽題</button>
            </div>
          </div>

          <!-- Card 4: 大樣 -->
          <div class="exam-card">
            <div class="badge-container">
              <div class="badge-group">
                <span class="badge">大樣</span>
              </div>
              <span class="pool-counter" id="cnt-dayang">12/12</span>
            </div>
            <div class="result-display" id="res-dayang"></div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('dayang')">抽題</button>
            </div>
          </div>
        </div>
      </div>

      <div class="master-draw-container">
        <button class="btn-master" onclick="drawAll()">
          <span>⚡ 全套一鍵抽題</span>
        </button>
      </div>
    </div>

    <!-- VIEW 2: HISTORY TAB -->
    <div id="view-history" class="view-content">
      <div id="history-container" class="history-list">
        <!-- Rendered dynamically -->
      </div>
      <div class="clear-history-container">
        <button class="btn-secondary" onclick="clearAllHistory()">清除全部紀錄</button>
      </div>
    </div>

    <div class="device-footer">
      <span>MODEL: EP-133 / FIELD</span>
      <span>MEM: LOCAL_STORAGE</span>
      <span>REV: 2.2.0</span>
    </div>
  </div>

  <script>
    const POOL_SPECS = {
      pingpei: {
        total: 36,
        createAll: () => {
          const items = [];
          for (let n = 201; n <= 206; n++) {
            ['A', 'B', 'C', 'D', 'E', 'F'].forEach(l => {
              items.push({ val: `${n} ${l}` });
            });
          }
          return items;
        }
      },
      tianli: {
        total: 6,
        createAll: () => {
          const items = [];
          ['天', '立'].forEach(mode => {
            ['餐廳', '客廳', '主臥'].forEach(space => {
              items.push({ val: space, subType: mode });
            });
          });
          return items;
        }
      },
      toushi: {
        total: 18,
        createAll: () => {
          const items = [];
          for (let n = 207; n <= 212; n++) {
            ['甲', '乙', '丙'].forEach(l => {
              items.push({ val: `${n} ${l}` });
            });
          }
          return items;
        }
      },
      dayang: {
        total: 12,
        createAll: () => {
          const items = [];
          for (let n = 213; n <= 224; n++) {
            items.push({ val: `${n}` });
          }
          return items;
        }
      }
    };

    const STORAGE_KEY_LOGS = 'TE_EXAM_MOCK_LOGS_V4';
    const STORAGE_KEY_POOLS = 'TE_EXAM_MOCK_POOLS_V4';

    let activePools = {};

    function initPools() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_POOLS);
        if (saved) {
          activePools = JSON.parse(saved);
        }
      } catch (e) {
        activePools = {};
      }

      Object.keys(POOL_SPECS).forEach(key => {
        if (!activePools[key] || !Array.isArray(activePools[key]) || activePools[key].length === 0) {
          activePools[key] = POOL_SPECS[key].createAll();
        }
      });
      savePoolsState();
      updateCountersUI();
    }

    function savePoolsState() {
      try {
        localStorage.setItem(STORAGE_KEY_POOLS, JSON.stringify(activePools));
      } catch (e) {}
    }

    function updateCountersUI() {
      Object.keys(POOL_SPECS).forEach(key => {
        const el = document.getElementById(`cnt-${key}`);
        if (el) {
          const rem = activePools[key] ? activePools[key].length : 0;
          const tot = POOL_SPECS[key].total;
          el.innerText = `${rem}/${tot}`;
        }
      });
    }

    /* Pull a unique non-repeating item from remaining pool */
    function popFromPool(type) {
      if (!activePools[type] || activePools[type].length === 0) {
        activePools[type] = POOL_SPECS[type].createAll();
      }

      const randomIndex = Math.floor(Math.random() * activePools[type].length);
      const pickedItem = activePools[type].splice(randomIndex, 1)[0];

      // Auto refill if empty for future draws
      if (activePools[type].length === 0) {
        activePools[type] = POOL_SPECS[type].createAll();
      }

      savePoolsState();
      updateCountersUI();
      return pickedItem;
    }

    const playSynthSound = (freq = 440, type = 'sine', duration = 0.08) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    };

    function switchTab(tab) {
      playSynthSound(600, 'triangle', 0.05);
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

      if (tab === 'draw') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('view-draw').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('view-history').classList.add('active');
        renderHistory();
      }
    }

    function updateTianLiBadges(subType) {
      const bTian = document.getElementById('badge-tian');
      const bLi = document.getElementById('badge-li');
      if (subType === '天') {
        bTian.className = 'badge';
        bLi.className = 'badge-outline';
      } else if (subType === '立') {
        bTian.className = 'badge-outline';
        bLi.className = 'badge';
      } else {
        bTian.className = 'badge-outline';
        bLi.className = 'badge-outline';
      }
    }

    function drawSingle(type) {
      playSynthSound(300, 'sawtooth', 0.12);
      const el = document.getElementById(`res-${type}`);
      el.classList.add('animating');

      let counter = 0;
      const interval = setInterval(() => {
        // Shuffle effect with dummy samples
        const dummy = POOL_SPECS[type].createAll();
        const temp = dummy[Math.floor(Math.random() * dummy.length)];
        el.innerText = temp.val;
        if (type === 'tianli') updateTianLiBadges(temp.subType);
        
        playSynthSound(800 + counter * 50, 'square', 0.03);
        counter++;
        
        if (counter > 8) {
          clearInterval(interval);
          const finalResult = popFromPool(type);
          el.innerText = finalResult.val;
          el.classList.remove('animating');

          if (type === 'tianli') updateTianLiBadges(finalResult.subType);

          saveRecordToHistory([{
            type: type,
            val: finalResult.val,
            subType: finalResult.subType || null,
            ts: Date.now()
          }]);
        }
      }, 50);
    }

    function drawAll() {
      playSynthSound(200, 'square', 0.2);
      const keys = ['pingpei', 'tianli', 'toushi', 'dayang'];
      const currentTs = Date.now();
      const newRecords = [];

      keys.forEach((type, idx) => {
        setTimeout(() => {
          const el = document.getElementById(`res-${type}`);
          el.classList.add('animating');
          let counter = 0;
          const interval = setInterval(() => {
            const dummy = POOL_SPECS[type].createAll();
            const temp = dummy[Math.floor(Math.random() * dummy.length)];
            el.innerText = temp.val;
            if (type === 'tianli') updateTianLiBadges(temp.subType);
            
            counter++;
            if (counter > 6) {
              clearInterval(interval);
              const finalResult = popFromPool(type);
              el.innerText = finalResult.val;
              el.classList.remove('animating');

              if (type === 'tianli') updateTianLiBadges(finalResult.subType);

              newRecords.push({
                type: type,
                val: finalResult.val,
                subType: finalResult.subType || null,
                ts: currentTs + idx // slight offset for exact ordering
              });

              if (newRecords.length === 4) {
                saveRecordToHistory(newRecords);
              }
            }
          }, 40);
        }, idx * 120);
      });
    }

    function getLogs() {
      try {
        const data = localStorage.getItem(STORAGE_KEY_LOGS);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveRecordToHistory(items) {
      const logs = getLogs();
      items.forEach(item => {
        logs.push({
          id: item.ts + '_' + Math.random().toString(36).substr(2, 4),
          type: item.type,
          val: item.val,
          subType: item.subType || null,
          ts: item.ts
        });
      });

      // Sort globally by timestamp descending
      logs.sort((a, b) => b.ts - a.ts);

      localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(logs));
    }

    function deleteHistoryItem(id) {
      playSynthSound(400, 'sine', 0.08);
      let logs = getLogs();
      logs = logs.filter(item => item.id !== id);
      localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(logs));
      renderHistory();
    }

    function clearAllHistory() {
      if (confirm('確定要清除所有抽題紀錄？')) {
        playSynthSound(150, 'sawtooth', 0.2);
        localStorage.removeItem(STORAGE_KEY_LOGS);
        renderHistory();
      }
    }

    function formatTimeFromTs(ts) {
      const d = new Date(ts);
      const dateStr = `${d.getFullYear()} / ${String(d.getMonth() + 1).padStart(2, '0')} / ${String(d.getDate()).padStart(2, '0')}`;
      const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      return { date: dateStr, time: timeStr };
    }

    function renderHistory() {
      const logs = getLogs();
      const container = document.getElementById('history-container');

      if (!logs || logs.length === 0) {
        container.innerHTML = `<div class="empty-state">尚無抽題紀錄<br><span style="font-size:11px; opacity:0.7;">NO HISTORICAL DATA</span></div>`;
        return;
      }

      // Group strictly sorted logs by Date string
      const groupedMap = new Map();
      logs.forEach(item => {
        const { date, time } = formatTimeFromTs(item.ts);
        if (!groupedMap.has(date)) {
          groupedMap.set(date, []);
        }
        groupedMap.get(date).push({ ...item, timeStr: time });
      });

      const typeLabels = {
        pingpei: '平配',
        toushi: '透視',
        dayang: '大樣'
      };

      let html = '';
      groupedMap.forEach((items, dateStr) => {
        html += `<div class="history-group">
          <div class="history-group-header">
            <span>📅 ${dateStr}</span>
            <span style="font-size:10px; opacity:0.6;">LOG_GROUP</span>
          </div>
          <div class="cards-column">`;

        items.forEach(item => {
          let badgeHTML = '';
          if (item.type === 'tianli') {
            const isTian = item.subType === '天';
            badgeHTML = `<span class="${isTian ? 'badge' : 'badge-outline'}">天</span><span class="${!isTian ? 'badge' : 'badge-outline'}">立</span>`;
          } else {
            badgeHTML = `<span class="badge">${typeLabels[item.type]}</span>`;
          }

          html += `
            <div class="exam-card">
              <div class="badge-container">
                <div class="badge-group">
                  ${badgeHTML}
                  <span class="timestamp-inline">${item.timeStr}</span>
                </div>
              </div>
              <div class="result-display">${item.val}</div>
              <div class="card-action-bar">
                <button class="btn-action-compact delete" onclick="deleteHistoryItem('${item.id}')">刪除</button>
              </div>
            </div>`;
        });

        html += `</div></div>`;
      });

      container.innerHTML = html;
    }

    // Initialize pool state on load
    window.onload = function() {
      initPools();
    };
  </script>
</body>
</html>
