<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>室設乙模擬考抽題系統 - Teenage Engineering Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #DCDCD7;
      --device-bg: #E6E5E0;
      --card-bg: #F4F3EE;
      --border-color: #111111;
      --text-color: #111111;
      --accent-orange: #FF3B00;
      --accent-green: #00D154;
      --sub-text: #666660;
      --border-width: 2px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(var(--sub-text) 0.75px, transparent 0.75px),
        linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 16px 16px, 32px 32px;
      font-family: 'JetBrains Mono', 'Noto Sans TC', monospace, sans-serif;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Outer TE Device Frame */
    .te-device {
      width: 100%;
      max-width: 520px;
      background: var(--device-bg);
      border: var(--border-width) solid var(--border-color);
      border-radius: 12px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        inset 0 -2px 0 rgba(0, 0, 0, 0.1);
      padding: 20px;
      position: relative;
    }

    /* Screws on device corners */
    .screw {
      width: 10px;
      height: 10px;
      border: 1.5px solid var(--border-color);
      border-radius: 50%;
      position: absolute;
      background: #D5D4CE;
    }
    .screw::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 2px;
      right: 2px;
      height: 1.5px;
      background: var(--border-color);
      transform: translateY(-50%) rotate(45deg);
    }
    .screw.tl { top: 8px; left: 8px; }
    .screw.tr { top: 8px; right: 8px; }
    .screw.bl { bottom: 8px; left: 8px; }
    .screw.br { bottom: 8px; right: 8px; }

    /* Header Bar */
    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #B8B7B0;
      font-size: 10px;
      letter-spacing: 1.5px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-orange);
      box-shadow: 0 0 6px var(--accent-orange);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Main Navigation Tabs */
    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: var(--border-width) solid var(--border-color);
      background: var(--border-color);
      gap: 2px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: var(--device-bg);
      border: none;
      padding: 12px 0;
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--border-color);
      color: #FFFFFF;
    }

    .tab-btn:hover:not(.active) {
      background: #E0DFDA;
    }

    /* Tab Content Views */
    .view-content {
      display: none;
    }

    .view-content.active {
      display: block;
    }

    /* Draw Matrix Container (2 Column Main Grid) */
    .draw-grid {
      display: grid;
      grid-template-columns: 68px 1fr;
      border: var(--border-width) solid var(--border-color);
      background: var(--card-bg);
    }

    /* Left Side: Morning / Afternoon Labels */
    .time-column {
      display: flex;
      flex-direction: column;
      border-right: var(--border-width) solid var(--border-color);
    }

    .time-block {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      writing-mode: vertical-lr;
      text-orientation: upright;
      background: #EAE8E2;
    }

    .time-block.morning {
      border-bottom: var(--border-width) solid var(--border-color);
    }

    /* Right Side: 4 Exam Cards Container */
    .cards-column {
      display: flex;
      flex-direction: column;
    }

    /* Individual Card Box */
    .exam-card {
      position: relative;
      padding: 12px 14px 10px 14px;
      min-height: 105px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-bottom: var(--border-width) solid var(--border-color);
      background: #FFFFFF;
    }

    /* Horizontal Line Alignment Fix: 2nd & 4th cards handled */
    .exam-card:last-child {
      border-bottom: none;
    }

    /* Badge Tag (e.g., 平配, 天 立, 透視, 大樣) */
    .badge-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      background: var(--border-color);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 2px;
      line-height: 1;
      display: inline-block;
    }

    .badge-outline {
      background: transparent;
      color: var(--text-color);
      border: 1.5px solid var(--border-color);
      font-size: 12px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 2px;
      line-height: 1;
      display: inline-block;
    }

    .timestamp-inline {
      font-size: 11px;
      font-weight: 600;
      color: var(--sub-text);
      margin-left: 6px;
    }

    /* Main Result Display Text */
    .result-display {
      font-size: 38px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 3px;
      margin: 4px 0;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
    }

    .result-display.animating {
      color: var(--accent-orange);
    }

    /* Modern Compact Button (Without Triangle Cut/Block) */
    .card-action-bar {
      display: flex;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .btn-action-compact {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text-color);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-action-compact:hover {
      background: var(--border-color);
      color: #FFFFFF;
    }

    .btn-action-compact:active {
      transform: translateY(1px);
    }

    .btn-action-compact.delete:hover {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      color: #FFFFFF;
    }

    /* Global Draw All Master Button */
    .master-draw-container {
      margin-top: 16px;
    }

    .btn-master {
      width: 100%;
      background: var(--accent-orange);
      color: #FFFFFF;
      border: var(--border-width) solid var(--border-color);
      padding: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--border-color);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-master:hover {
      background: #E63500;
    }

    .btn-master:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border-color);
    }

    /* Record / History View Styling */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Custom Scrollbar */
    .history-list::-webkit-scrollbar {
      width: 6px;
    }
    .history-list::-webkit-scrollbar-track {
      background: #E0DFDA;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
    }

    .history-group {
      border: var(--border-width) solid var(--border-color);
      background: #FFFFFF;
    }

    .history-group-header {
      background: #EAE8E2;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1.5px;
      border-bottom: var(--border-width) solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--sub-text);
      font-weight: 600;
      font-size: 14px;
      border: 2px dashed #B8B7B0;
      background: rgba(255, 255, 255, 0.4);
    }

    .clear-history-container {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-secondary {
      background: transparent;
      border: 1.5px solid var(--border-color);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: var(--border-color);
      color: #FFFFFF;
    }

    /* Footer Specs */
    .device-footer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px dashed #B8B7B0;
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--sub-text);
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="te-device">
    <!-- Industrial Screws -->
    <div class="screw tl"></div>
    <div class="screw tr"></div>
    <div class="screw bl"></div>
    <div class="screw br"></div>

    <!-- Top Status Header -->
    <div class="device-header">
      <div class="brand-tag">
        <div class="status-led"></div>
        <span>TE-EXAM-2026 // FIELD UNIT</span>
      </div>
      <div>室設乙模擬考</div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('draw')">抽題</button>
      <button class="tab-btn" onclick="switchTab('history')">記錄</button>
    </div>

    <!-- VIEW 1: DRAW TAB (抽題) -->
    <div id="view-draw" class="view-content active">
      <div class="draw-grid">
        <!-- Left Time Indicator Column -->
        <div class="time-column">
          <div class="time-block morning">上午</div>
          <div class="time-block afternoon">下午</div>
        </div>

        <!-- Right 4 Card Items Column -->
        <div class="cards-column">
          <!-- Card 1: 平配 -->
          <div class="exam-card">
            <div class="badge-container">
              <span class="badge">平配</span>
            </div>
            <div class="result-display" id="res-pingpei">201 A</div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('pingpei')">抽題</button>
            </div>
          </div>

          <!-- Card 2: 天 / 立 -->
          <div class="exam-card">
            <div class="badge-container">
              <span class="badge-outline">天</span>
              <span class="badge">立</span>
            </div>
            <div class="result-display" id="res-tianli">客廳</div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('tianli')">抽題</button>
            </div>
          </div>

          <!-- Card 3: 透視 -->
          <div class="exam-card">
            <div class="badge-container">
              <span class="badge">透視</span>
            </div>
            <div class="result-display" id="res-toushi">207 丙</div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('toushi')">抽題</button>
            </div>
          </div>

          <!-- Card 4: 大樣 -->
          <div class="exam-card">
            <div class="badge-container">
              <span class="badge">大樣</span>
            </div>
            <div class="result-display" id="res-dayang">213</div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('dayang')">抽題</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Master Roll Button -->
      <div class="master-draw-container">
        <button class="btn-master" onclick="drawAll()">
          <span>⚡ 全套一鍵抽題</span>
        </button>
      </div>
    </div>

    <!-- VIEW 2: HISTORY TAB (記錄) -->
    <div id="view-history" class="view-content">
      <div id="history-container" class="history-list">
        <!-- Rendered dynamically via JavaScript -->
      </div>
      <div class="clear-history-container">
        <button class="btn-secondary" onclick="clearAllHistory()">清除全部紀錄</button>
      </div>
    </div>

    <!-- Bottom Specs Footer -->
    <div class="device-footer">
      <span>MODEL: EP-133 / STYLE</span>
      <span>MEM: LOCAL_STORAGE</span>
      <span>REV: 2.0.4</span>
    </div>
  </div>

  <script>
    /* Question Generator Logic */
    const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const getRandomArr = (arr) => arr[Math.floor(Math.random() * arr.length)];

    const GENERATORS = {
      pingpei: () => `${getRandomInt(201, 206)} ${getRandomArr(['A', 'B', 'C', 'D', 'E', 'F'])}`,
      tianli: () => `${getRandomArr(['天', '立'])} ${getRandomArr(['餐廳', '客廳', '主臥'])}`,
      toushi: () => `${getRandomInt(207, 212)} ${getRandomArr(['甲', '乙', '丙'])}`,
      dayang: () => `${getRandomInt(213, 224)}`
    };

    /* State Management */
    let currentResults = {
      pingpei: '201 A',
      tianli: '客廳',
      toushi: '207 丙',
      dayang: '213'
    };

    const STORAGE_KEY = 'TE_EXAM_MOCK_HISTORY_V2';

    /* Web Audio API Synthesizer Sound Effects */
    const playSynthSound = (freq = 440, type = 'sine', duration = 0.08) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    };

    /* Tab Switcher */
    function switchTab(tab) {
      playSynthSound(600, 'triangle', 0.05);
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

      if (tab === 'draw') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('view-draw').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('view-history').classList.add('active');
        renderHistory();
      }
    }

    /* Single Question Drawer Animation */
    function drawSingle(type) {
      playSynthSound(300, 'sawtooth', 0.12);
      const el = document.getElementById(`res-${type}`);
      el.classList.add('animating');

      let counter = 0;
      const interval = setInterval(() => {
        el.innerText = GENERATORS[type]();
        playSynthSound(800 + counter * 50, 'square', 0.03);
        counter++;
        if (counter > 8) {
          clearInterval(interval);
          const finalVal = GENERATORS[type]();
          el.innerText = finalVal;
          el.classList.remove('animating');
          currentResults[type] = finalVal;
          
          saveRecordToHistory([{
            type: type,
            val: finalVal,
            time: getFormattedTime()
          }]);
        }
      }, 50);
    }

    /* Master Draw All Questions */
    function drawAll() {
      playSynthSound(200, 'square', 0.2);
      const keys = ['pingpei', 'tianli', 'toushi', 'dayang'];
      const timestamp = getFormattedTime();
      const newRecords = [];

      keys.forEach((type, idx) => {
        setTimeout(() => {
          const el = document.getElementById(`res-${type}`);
          el.classList.add('animating');
          let counter = 0;
          const interval = setInterval(() => {
            el.innerText = GENERATORS[type]();
            counter++;
            if (counter > 6) {
              clearInterval(interval);
              const finalVal = GENERATORS[type]();
              el.innerText = finalVal;
              el.classList.remove('animating');
              currentResults[type] = finalVal;
              
              newRecords.push({
                type: type,
                val: finalVal,
                time: timestamp
              });

              if (newRecords.length === 4) {
                saveRecordToHistory(newRecords);
              }
            }
          }, 40);
        }, idx * 120);
      });
    }

    /* Time formatting YYYY/MM/DD and HH:mm */
    function getFormattedTime() {
      const now = new Date();
      const dateStr = `${now.getFullYear()} / ${String(now.getMonth() + 1).padStart(2, '0')} / ${String(now.getDate()).padStart(2, '0')}`;
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      return { date: dateStr, time: timeStr };
    }

    /* LocalStorage History Handlers */
    function getHistory() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveRecordToHistory(items) {
      const history = getHistory();
      const dateGroup = items[0].time.date;

      let group = history.find(g => g.date === dateGroup);
      if (!group) {
        group = { date: dateGroup, items: [] };
        history.unshift(group);
      }

      items.forEach(item => {
        group.items.unshift({
          id: Date.now() + Math.random().toString(36).substr(2, 4),
          type: item.type,
          val: item.val,
          time: item.time.time
        });
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function deleteHistoryItem(id) {
      playSynthSound(400, 'sine', 0.08);
      let history = getHistory();
      history.forEach(group => {
        group.items = group.items.filter(item => item.id !== id);
      });
      history = history.filter(group => group.items.length > 0);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistory();
    }

    function clearAllHistory() {
      if (confirm('確定要清除所有抽題紀錄？')) {
        playSynthSound(150, 'sawtooth', 0.2);
        localStorage.removeItem(STORAGE_KEY);
        renderHistory();
      }
    }

    /* Render History View */
    function renderHistory() {
      const history = getHistory();
      const container = document.getElementById('history-container');

      if (!history || history.length === 0) {
        container.innerHTML = `<div class="empty-state">尚無抽題紀錄<br><span style="font-size:11px; opacity:0.7;">NO HISTORICAL DATA</span></div>`;
        return;
      }

      const typeLabels = {
        pingpei: { title: '平配', outline: false },
        tianli: { title: '天 立', outline: true },
        toushi: { title: '透視', outline: false },
        dayang: { title: '大樣', outline: false }
      };

      let html = '';
      history.forEach(group => {
        html += `<div class="history-group">
          <div class="history-group-header">
            <span>📅 ${group.date}</span>
            <span style="font-size:10px; opacity:0.6;">LOG_GROUP</span>
          </div>
          <div class="cards-column">`;

        group.items.forEach(item => {
          const badgeClass = item.type === 'tianli' 
            ? `<span class="badge-outline">天</span><span class="badge">立</span>` 
            : `<span class="badge">${typeLabels[item.type].title}</span>`;

          html += `
            <div class="exam-card" style="min-height:90px;">
              <div class="badge-container">
                ${badgeClass}
                <span class="timestamp-inline">${item.time}</span>
              </div>
              <div class="result-display" style="font-size: 28px; min-height:36px;">${item.val}</div>
              <div class="card-action-bar">
                <button class="btn-action-compact delete" onclick="deleteHistoryItem('${item.id}')">刪除</button>
              </div>
            </div>`;
        });

        html += `</div></div>`;
      });

      container.innerHTML = html;
    }
  </script>
</body>
</html>
