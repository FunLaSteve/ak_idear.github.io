<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>室設乙模擬考抽題系統 - Teenage Engineering Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #DCDCD7;
      --device-bg: #E6E5E0;
      --card-bg: #F4F3EE;
      --border-color: #111111;
      --text-color: #111111;
      --accent-orange: #FF3B00;
      --sub-text: #666660;
      --border-width: 2px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(var(--sub-text) 0.75px, transparent 0.75px),
        linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 16px 16px, 32px 32px;
      font-family: 'JetBrains Mono', 'Noto Sans TC', monospace, sans-serif;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* TE Outer Frame */
    .te-device {
      width: 100%;
      max-width: 520px;
      background: var(--device-bg);
      border: var(--border-width) solid var(--border-color);
      border-radius: 12px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        inset 0 -2px 0 rgba(0, 0, 0, 0.1);
      padding: 20px;
      position: relative;
    }

    /* Metal Corner Screws */
    .screw {
      width: 10px;
      height: 10px;
      border: 1.5px solid var(--border-color);
      border-radius: 50%;
      position: absolute;
      background: #D5D4CE;
    }
    .screw::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 2px;
      right: 2px;
      height: 1.5px;
      background: var(--border-color);
      transform: translateY(-50%) rotate(45deg);
    }
    .screw.tl { top: 8px; left: 8px; }
    .screw.tr { top: 8px; right: 8px; }
    .screw.bl { bottom: 8px; left: 8px; }
    .screw.br { bottom: 8px; right: 8px; }

    /* Header Status Bar */
    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #B8B7B0;
      font-size: 10px;
      letter-spacing: 1.5px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-orange);
      box-shadow: 0 0 6px var(--accent-orange);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Main Navigation Tabs */
    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: var(--border-width) solid var(--border-color);
      background: var(--border-color);
      gap: 2px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: var(--device-bg);
      border: none;
      padding: 12px 0;
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--border-color);
      color: #FFFFFF;
    }

    .tab-btn:hover:not(.active) {
      background: #E0DFDA;
    }

    /* Tab Content Views */
    .view-content {
      display: none;
    }

    .view-content.active {
      display: block;
    }

    /* Main Grid Layout */
    .draw-grid {
      display: grid;
      grid-template-columns: 68px 1fr;
      border: var(--border-width) solid var(--border-color);
      background: var(--card-bg);
    }

    /* Left Side: Time Column */
    .time-column {
      display: flex;
      flex-direction: column;
      border-right: var(--border-width) solid var(--border-color);
    }

    .time-block {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      writing-mode: vertical-lr;
      text-orientation: upright;
      background: #EAE8E2;
    }

    .time-block.morning {
      border-bottom: var(--border-width) solid var(--border-color);
    }

    /* Right Side Cards Column */
    .cards-column {
      display: flex;
      flex-direction: column;
    }

    /* Card Item (Strictly Fixed Dimensions) */
    .exam-card {
      position: relative;
      padding: 10px 14px 8px 14px;
      height: 110px; /* Fixed card height */
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-bottom: var(--border-width) solid var(--border-color);
      background: #FFFFFF;
    }

    .exam-card:last-child {
      border-bottom: none;
    }

    /* Category Badges & Pool Counter Row */
    .badge-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 20px; /* Fixed height for top label row */
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .badge {
      background: var(--border-color);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 2px;
      line-height: 1;
      display: inline-block;
      border: 1.5px solid var(--border-color);
    }

    .badge-outline {
      background: transparent;
      color: var(--text-color);
      border: 1.5px solid var(--border-color);
      font-size: 12px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 2px;
      line-height: 1;
      display: inline-block;
    }

    .pool-counter {
      font-size: 11px;
      font-weight: 700;
      color: var(--sub-text);
      letter-spacing: 1px;
    }

    .timestamp-inline {
      font-size: 11px;
      font-weight: 600;
      color: var(--sub-text);
      margin-left: 6px;
    }

    /* Result Display Area (Fixed Height to Prevent Layout Shift) */
    .result-display {
      font-size: 36px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 3px;
      height: 52px; /* Fixed result display height */
      line-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      overflow: hidden;
      white-space: nowrap;
    }

    .result-display.animating {
      color: var(--accent-orange);
    }

    /* Compact Rectangular Action Buttons */
    .card-action-bar {
      display: flex;
      justify-content: flex-end;
      height: 22px; /* Fixed bottom button row height */
    }

    .btn-action-compact {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text-color);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action-compact:hover {
      background: var(--border-color);
      color: #FFFFFF;
    }

    .btn-action-compact:active {
      transform: translateY(1px);
    }

    .btn-action-compact.delete:hover {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      color: #FFFFFF;
    }

    /* Master Draw All Button */
    .master-draw-container {
      margin-top: 16px;
    }

    .btn-master {
      width: 100%;
      background: var(--accent-orange);
      color: #FFFFFF;
      border: var(--border-width) solid var(--border-color);
      padding: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--border-color);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-master:hover {
      background: #E63500;
    }

    .btn-master:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border-color);
    }

    /* History Log List View */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-list::-webkit-scrollbar {
      width: 6px;
    }
    .history-list::-webkit-scrollbar-track {
      background: #E0DFDA;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
    }

    .history-group {
      border: var(--border-width) solid var(--border-color);
      background: #FFFFFF;
    }

    .history-group-header {
      background: #EAE8E2;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1.5px;
      border-bottom: var(--border-width) solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--sub-text);
      font-weight: 600;
      font-size: 14px;
      border: 2px dashed #B8B7B0;
      background: rgba(255, 255, 255, 0.4);
    }

    .clear-history-container {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-secondary {
      background: transparent;
      border: 1.5px solid var(--border-color);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-secondary:hover {
      background: var(--border-color);
      color: #FFFFFF;
    }

    /* Modal Overlay (TE Style) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 90%;
      max-width: 380px;
      background: var(--device-bg);
      border: var(--border-width) solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.25);
      padding: 16px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px dashed #B8B7B0;
      margin-bottom: 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .search-input-box {
      display: flex;
      border: var(--border-width) solid var(--border-color);
      background: #FFFFFF;
      border-radius: 4px;
      overflow: hidden;
    }

    .search-input-box input {
      flex: 1;
      border: none;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      outline: none;
      color: var(--text-color);
      background: transparent;
    }

    .search-input-box button {
      background: var(--border-color);
      color: #FFFFFF;
      border: none;
      padding: 0 16px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s ease;
    }

    .search-input-box button:hover {
      background: var(--accent-orange);
    }

    .active-filter-tag {
      font-size: 11px;
      font-weight: 700;
      background: #EAE8E2;
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Footer Specs */
    .device-footer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px dashed #B8B7B0;
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--sub-text);
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="te-device">
    <!-- TE Industrial Metal Screws -->
    <div class="screw tl"></div>
    <div class="screw tr"></div>
    <div class="screw bl"></div>
    <div class="screw br"></div>

    <!-- Header Status Bar -->
    <div class="device-header">
      <div class="brand-tag">
        <div class="status-led"></div>
        <span>TE-EXAM-2026 // FIELD UNIT</span>
      </div>
      <div>室設乙模擬考</div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('draw')">抽題</button>
      <button class="tab-btn" onclick="switchTab('history')">記錄</button>
    </div>

    <!-- VIEW 1: DRAW TAB (抽題) -->
    <div id="view-draw" class="view-content active">
      <div class="draw-grid">
        <!-- Left Time Column -->
        <div class="time-column">
          <div class="time-block morning">上午</div>
          <div class="time-block afternoon">下午</div>
        </div>

        <!-- Right 4 Exam Category Cards -->
        <div class="cards-column">
          <!-- Card 1: 平配 -->
          <div class="exam-card">
            <div class="badge-container">
              <div class="badge-group">
                <span class="badge">平配</span>
              </div>
              <span class="pool-counter" id="cnt-pingpei">36/36</span>
            </div>
            <div class="result-display" id="res-pingpei"></div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('pingpei')">抽題</button>
            </div>
          </div>

          <!-- Card 2: 天 / 立 -->
          <div class="exam-card">
            <div class="badge-container">
              <div class="badge-group">
                <span class="badge-outline" id="badge-tian">天</span>
                <span class="badge-outline" id="badge-li">立</span>
              </div>
              <span class="pool-counter" id="cnt-tianli">6/6</span>
            </div>
            <div class="result-display" id="res-tianli"></div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('tianli')">抽題</button>
            </div>
          </div>

          <!-- Card 3: 透視 -->
          <div class="exam-card">
            <div class="badge-container">
              <div class="badge-group">
                <span class="badge">透視</span>
              </div>
              <span class="pool-counter" id="cnt-toushi">18/18</span>
            </div>
            <div class="result-display" id="res-toushi"></div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('toushi')">抽題</button>
            </div>
          </div>

          <!-- Card 4: 大樣 -->
          <div class="exam-card">
            <div class="badge-container">
              <div class="badge-group">
                <span class="badge">大樣</span>
              </div>
              <span class="pool-counter" id="cnt-dayang">12/12</span>
            </div>
            <div class="result-display" id="res-dayang"></div>
            <div class="card-action-bar">
              <button class="btn-action-compact" onclick="drawSingle('dayang')">抽題</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Master Draw All Button -->
      <div class="master-draw-container">
        <button class="btn-master" onclick="drawAll()">
          <span>⚡ 全套一鍵抽題</span>
        </button>
      </div>
    </div>

    <!-- VIEW 2: HISTORY TAB (記錄) -->
    <div id="view-history" class="view-content">
      <div id="filter-status-bar" style="display:none; margin-bottom:10px;">
        <span class="active-filter-tag">
          <span id="active-keyword-label">搜尋: </span>
          <span style="cursor:pointer; font-weight:900;" onclick="clearSearchFilter()">✕</span>
        </span>
      </div>

      <div id="history-container" class="history-list">
        <!-- Rendered dynamically -->
      </div>

      <div class="clear-history-container">
        <button class="btn-secondary" onclick="openSearchModal()">🔍 搜尋紀錄</button>
        <button class="btn-secondary" onclick="clearAllHistory()">清除全部紀錄</button>
      </div>
    </div>

    <!-- Footer Information -->
    <div class="device-footer">
      <span>MODEL: EP-133 / FIELD</span>
      <span>MEM: LOCAL_STORAGE</span>
      <span>REV: 2.2.1</span>
    </div>
  </div>

  <!-- Search Modal -->
  <div class="modal-overlay" id="search-modal">
    <div class="modal-card">
      <div class="screw tl"></div>
      <div class="screw tr"></div>
      <div class="screw bl"></div>
      <div class="screw br"></div>
      <div class="modal-header">
        <span>🔍 SEARCH LOGS</span>
        <span style="cursor:pointer;" onclick="closeSearchModal()">✕</span>
      </div>
      <div class="search-input-box">
        <input type="text" id="search-keyword" placeholder="輸入關鍵字 (如: 201, 客廳...)" onkeydown="if(event.key==='Enter') executeSearch()">
        <button onclick="executeSearch()">🔍</button>
      </div>
    </div>
  </div>

  <script>
    /* Question Pools Definition */
    const CATEGORY_POOLS = {
      pingpei: (() => {
        const pool = [];
        for (let i = 201; i <= 206; i++) {
          ['A', 'B', 'C', 'D', 'E', 'F'].forEach(letter => {
            pool.push({ val: `${i} ${letter}` });
          });
        }
        return pool;
      })(),
      tianli: (() => {
        const pool = [];
        ['天', '立'].forEach(type => {
          ['餐廳', '客廳', '主臥'].forEach(space => {
            pool.push({ val: space, subType: type });
          });
        });
        return pool;
      })(),
      toushi: (() => {
        const pool = [];
        for (let i = 207; i <= 212; i++) {
          ['甲', '乙', '丙'].forEach(sym => {
            pool.push({ val: `${i} ${sym}` });
          });
        }
        return pool;
      })(),
      dayang: (() => {
        const pool = [];
        for (let i = 213; i <= 224; i++) {
          pool.push({ val: `${i}` });
        }
        return pool;
      })()
    };

    const STORAGE_KEY = 'TE_EXAM_MOCK_HISTORY_V4';
    let currentSearchKeyword = '';

    /* Global Audio Context Singleton for Reliable Sound FX */
    let globalAudioCtx = null;
    function getAudioContext() {
      if (!globalAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) globalAudioCtx = new AudioCtx();
      }
      if (globalAudioCtx && globalAudioCtx.state === 'suspended') {
        globalAudioCtx.resume();
      }
      return globalAudioCtx;
    }

    const playSynthSound = (freq = 440, type = 'sine', duration = 0.08) => {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    };

    /* Helper: Calculate Drawn Items and Pool Counts directly from History */
    function getDrawnPoolsFromHistory() {
      const history = getHistoryList();
      const drawnMap = { pingpei: [], tianli: [], toushi: [], dayang: [] };

      history.forEach(item => {
        if (!CATEGORY_POOLS[item.type]) return;
        const pool = CATEGORY_POOLS[item.type];
        
        let matchIdx = -1;
        if (item.type === 'tianli') {
          matchIdx = pool.findIndex(p => p.val === item.val && p.subType === item.subType);
        } else {
          matchIdx = pool.findIndex(p => p.val === item.val);
        }

        if (matchIdx !== -1 && !drawnMap[item.type].includes(matchIdx)) {
          drawnMap[item.type].push(matchIdx);
        }
      });

      return drawnMap;
    }

    /* Non-Repeating Drawer Algorithm */
    function getNextQuestion(type) {
      const drawnMap = getDrawnPoolsFromHistory();
      const fullPool = CATEGORY_POOLS[type];

      let availableIndices = [];
      for (let i = 0; i < fullPool.length; i++) {
        if (!drawnMap[type].includes(i)) {
          availableIndices.push(i);
        }
      }

      // If all items in this category are drawn, reset pool
      if (availableIndices.length === 0) {
        for (let i = 0; i < fullPool.length; i++) availableIndices.push(i);
      }

      const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
      return fullPool[randomIndex];
    }

    function updatePoolCounters() {
      const drawnMap = getDrawnPoolsFromHistory();

      Object.keys(CATEGORY_POOLS).forEach(type => {
        const fullSize = CATEGORY_POOLS[type].length;
        const drawnSize = drawnMap[type].length;
        const remaining = fullSize - drawnSize;
        const el = document.getElementById(`cnt-${type}`);
        if (el) {
          el.innerText = `${remaining}/${fullSize}`;
        }
      });
    }

    /* Restore Today's Latest Draw Results on Draw Page Load/Switch */
    function restoreTodayLatestResults() {
      const history = getHistoryList();
      const now = new Date();
      const todayStr = `${now.getFullYear()} / ${String(now.getMonth() + 1).padStart(2, '0')} / ${String(now.getDate()).padStart(2, '0')}`;

      // Reset all cards to empty first
      ['pingpei', 'tianli', 'toushi', 'dayang'].forEach(type => {
        const el = document.getElementById(`res-${type}`);
        if (el) el.innerText = '';
      });
      updateTianLiBadges(null);

      // Find today's latest result for each category
      const categories = ['pingpei', 'tianli', 'toushi', 'dayang'];
      categories.forEach(type => {
        const latestRecord = history.find(item => {
          const itemDate = formatTimestamp(item.timestamp).date;
          return item.type === type && itemDate === todayStr;
        });

        if (latestRecord) {
          const el = document.getElementById(`res-${type}`);
          if (el) el.innerText = latestRecord.val;
          if (type === 'tianli') updateTianLiBadges(latestRecord.subType);
        }
      });
    }

    /* Tab Switcher */
    function switchTab(tab) {
      playSynthSound(600, 'triangle', 0.05);
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

      if (tab === 'draw') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('view-draw').classList.add('active');
        updatePoolCounters();
        restoreTodayLatestResults();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('view-history').classList.add('active');
        renderHistory();
      }
    }

    /* Update Badges for Tian/Li */
    function updateTianLiBadges(subType) {
      const bTian = document.getElementById('badge-tian');
      const bLi = document.getElementById('badge-li');
      if (subType === '天') {
        bTian.className = 'badge';
        bLi.className = 'badge-outline';
      } else if (subType === '立') {
        bTian.className = 'badge-outline';
        bLi.className = 'badge';
      } else {
        bTian.className = 'badge-outline';
        bLi.className = 'badge-outline';
      }
    }

    /* Single Drawer Logic */
    function drawSingle(type) {
      playSynthSound(300, 'sawtooth', 0.12);
      const el = document.getElementById(`res-${type}`);
      el.classList.add('animating');

      let counter = 0;
      const interval = setInterval(() => {
        const randomPool = CATEGORY_POOLS[type];
        const temp = randomPool[Math.floor(Math.random() * randomPool.length)];
        el.innerText = temp.val;
        if (type === 'tianli') updateTianLiBadges(temp.subType);
        
        playSynthSound(800 + counter * 50, 'square', 0.03);
        counter++;
        
        if (counter > 8) {
          clearInterval(interval);
          const finalResult = getNextQuestion(type);
          el.innerText = finalResult.val;
          el.classList.remove('animating');

          if (type === 'tianli') updateTianLiBadges(finalResult.subType);

          saveRecordToHistory([{
            type: type,
            val: finalResult.val,
            subType: finalResult.subType,
            timestamp: Date.now()
          }]);

          updatePoolCounters();
        }
      }, 50);
    }

    /* Master Draw All Logic */
    function drawAll() {
      playSynthSound(200, 'square', 0.2);
      const keys = ['pingpei', 'tianli', 'toushi', 'dayang'];
      const timestamp = Date.now();
      const newRecords = [];

      keys.forEach((type, idx) => {
        setTimeout(() => {
          const el = document.getElementById(`res-${type}`);
          el.classList.add('animating');
          let counter = 0;
          const interval = setInterval(() => {
            const randomPool = CATEGORY_POOLS[type];
            const temp = randomPool[Math.floor(Math.random() * randomPool.length)];
            el.innerText = temp.val;
            if (type === 'tianli') updateTianLiBadges(temp.subType);
            
            counter++;
            if (counter > 6) {
              clearInterval(interval);
              const finalResult = getNextQuestion(type);
              el.innerText = finalResult.val;
              el.classList.remove('animating');

              if (type === 'tianli') updateTianLiBadges(finalResult.subType);

              newRecords.push({
                type: type,
                val: finalResult.val,
                subType: finalResult.subType,
                timestamp: timestamp + idx
              });

              if (newRecords.length === 4) {
                saveRecordToHistory(newRecords);
                updatePoolCounters();
              }
            }
          }, 40);
        }, idx * 120);
      });
    }

    /* Formatter for Timestamps */
    function formatTimestamp(ts) {
      const d = new Date(ts);
      const dateStr = `${d.getFullYear()} / ${String(d.getMonth() + 1).padStart(2, '0')} / ${String(d.getDate()).padStart(2, '0')}`;
      const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
      return { date: dateStr, time: timeStr };
    }

    /* LocalStorage Flat List Handler */
    function getHistoryList() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveRecordToHistory(items) {
      let history = getHistoryList();
      items.forEach(item => {
        history.push({
          id: Date.now() + Math.random().toString(36).substr(2, 4),
          type: item.type,
          val: item.val,
          subType: item.subType || null,
          timestamp: item.timestamp || Date.now()
        });
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function deleteHistoryItem(id) {
      playSynthSound(400, 'sine', 0.08);
      let history = getHistoryList();
      history = history.filter(item => item.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      
      // Recalculate and update available pools immediately
      updatePoolCounters();
      renderHistory();
    }

    function clearAllHistory() {
      if (confirm('確定要清除所有抽題紀錄？')) {
        playSynthSound(150, 'sawtooth', 0.2);
        localStorage.removeItem(STORAGE_KEY);
        updatePoolCounters();
        restoreTodayLatestResults();
        renderHistory();
      }
    }

    /* Search Modal Controls */
    function openSearchModal() {
      playSynthSound(500, 'sine', 0.05);
      document.getElementById('search-modal').classList.add('active');
      document.getElementById('search-keyword').focus();
    }

    function closeSearchModal() {
      document.getElementById('search-modal').classList.remove('active');
    }

    function executeSearch() {
      playSynthSound(700, 'triangle', 0.08);
      const val = document.getElementById('search-keyword').value.trim();
      currentSearchKeyword = val;
      closeSearchModal();
      renderHistory();
    }

    function clearSearchFilter() {
      currentSearchKeyword = '';
      document.getElementById('search-keyword').value = '';
      renderHistory();
    }

    /* Render History Sorted strictly by Timestamp descending */
    function renderHistory() {
      let history = getHistoryList();

      // Sort by timestamp descending
      history.sort((a, b) => b.timestamp - a.timestamp);

      // Apply Keyword Filter if any
      if (currentSearchKeyword) {
        history = history.filter(item => {
          const matchVal = item.val.toLowerCase().includes(currentSearchKeyword.toLowerCase());
          const matchSub = item.subType && item.subType.toLowerCase().includes(currentSearchKeyword.toLowerCase());
          return matchVal || matchSub;
        });

        document.getElementById('filter-status-bar').style.display = 'block';
        document.getElementById('active-keyword-label').innerText = `搜尋關鍵字: "${currentSearchKeyword}" (${history.length} 筆)`;
      } else {
        document.getElementById('filter-status-bar').style.display = 'none';
      }

      const container = document.getElementById('history-container');

      if (!history || history.length === 0) {
        container.innerHTML = `<div class="empty-state">尚無符合的抽題紀錄<br><span style="font-size:11px; opacity:0.7;">NO HISTORICAL DATA</span></div>`;
        return;
      }

      // Group by Date for cleaner UI presentation
      const groups = {};
      history.forEach(item => {
        const { date, time } = formatTimestamp(item.timestamp);
        if (!groups[date]) groups[date] = [];
        groups[date].push({ ...item, formattedTime: time });
      });

      const typeLabels = {
        pingpei: '平配',
        toushi: '透視',
        dayang: '大樣'
      };

      let html = '';
      Object.keys(groups).forEach(dateStr => {
        html += `<div class="history-group">
          <div class="history-group-header">
            <span>📅 ${dateStr}</span>
            <span style="font-size:10px; opacity:0.6;">LOG_GROUP</span>
          </div>
          <div class="cards-column">`;

        groups[dateStr].forEach(item => {
          let badgeHTML = '';
          if (item.type === 'tianli') {
            const isTian = item.subType === '天';
            badgeHTML = `<span class="${isTian ? 'badge' : 'badge-outline'}">天</span><span class="${!isTian ? 'badge' : 'badge-outline'}">立</span>`;
          } else {
            badgeHTML = `<span class="badge">${typeLabels[item.type]}</span>`;
          }

          html += `
            <div class="exam-card">
              <div class="badge-container">
                <div class="badge-group">
                  ${badgeHTML}
                  <span class="timestamp-inline">${item.formattedTime}</span>
                </div>
              </div>
              <div class="result-display">${item.val}</div>
              <div class="card-action-bar">
                <button class="btn-action-compact delete" onclick="deleteHistoryItem('${item.id}')">刪除</button>
              </div>
            </div>`;
        });

        html += `</div></div>`;
      });

      container.innerHTML = html;
    }

    // Initialize on page load
    updatePoolCounters();
    restoreTodayLatestResults();
  </script>
</body>
</html>
